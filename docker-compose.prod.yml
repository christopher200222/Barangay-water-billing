# Full online system on ONE rented server (any VPS with Docker). Gives you: the website, its database, and automatic HTTPS.
#   1) point your domain's DNS A-record to the server's IP
#   2) copy .env.example to .env and fill it in
#   3) docker compose -f docker-compose.prod.yml up -d --build
services:
  web:
    build: .
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_NAME: ${DB_NAME:-brgy_tigbao_water}
      DB_USER: ${DB_USER:-tigbao}
      DB_PASS: ${DB_PASS:?set DB_PASS in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      TIGBAO_SYNC_KEY: ${TIGBAO_SYNC_KEY:-}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_APP_PASSWORD: ${MAIL_APP_PASSWORD:-}
      SMS_ENABLED: ${SMS_ENABLED:-false}
      SEMAPHORE_API_KEY: ${SEMAPHORE_API_KEY:-}
    volumes:
      - storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mariadb:10.11
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_NAME:-brgy_tigbao_water}
      MARIADB_USER: ${DB_USER:-tigbao}
      MARIADB_PASSWORD: ${DB_PASS}
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - dbdata:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env, e.g. water.example.com}
    command: caddy reverse-proxy --from ${DOMAIN} --to web:80
    volumes:
      - caddy_data:/data
    depends_on: [web]
  backup:
    image: mariadb:10.11
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          mariadb-dump -h db -u"$$DB_USER" -p"$$DB_PASS" --single-transaction "$$DB_NAME" | gzip > /backups/tigbao-$$(date +%F).sql.gz
          find /backups -name 'tigbao-*.sql.gz' -mtime +14 -delete
          sleep 86400
        done
    environment:
      DB_NAME: ${DB_NAME:-brgy_tigbao_water}
      DB_USER: ${DB_USER:-tigbao}
      DB_PASS: ${DB_PASS}
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy
volumes:
  dbdata:
  storage:
  caddy_data:
